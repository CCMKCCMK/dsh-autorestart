# dsh-autorestart bundle layer.
# Every key below is a documented default; override any of them in the profile's
# cordis.patch.yml with an `- id: dsh-autorestart` entry that repeats the full config.
- insert:
    - id: dsh-autorestart
      name: dsh-autorestart
      config:
        enabled: true
        # Empty = <DSH_HOME>/storages/dsh-autorestart/state.json
        stateFile: ''
        resumeOnBoot: true
        recoveryDelayMs: 6000
        maxSessions: 4
        maxResumeAttempts: 2
        deferPollMs: 3000
        deferSoftMs: 300000
        deferHardMs: 900000
        deferPolicy: auto
        # hard deadline only forces a restart over a running conversation when this is
        # enabled; by default it keeps waiting for the other conversations to finish
        forceRestartWhenBusy: false
        # app = relaunch the DeepSeek Harness desktop app; command = run restartCommand
        restartMode: app
        restartCommand: ''
        relaunchDelaySeconds: 2
        # quiet window (ms) after the last conversation activity before a restart may fire
        settleMs: 2000
        # RESTART reserve (ms): the extra wait after the LAST conversation
        # finished, before the host is really restarted. A restart is a daily
        # operation, so the default is 0 (no extra wait). A DROPDOWN in the
        # settings page: 0 / 5 / 10 / 20 / 30 / 60 seconds.
        # This plugin can only see the DSH agents — other plugins (a memory
        # plugin that writes its notes a few seconds later, a summary, an MCP
        # callback) queue their work with a timer of their own, and that work
        # is invisible here.
        restartGraceMs: 0
        # The graceful shutdown has NO reserve of its own: the visible
        # countdown (sleepCountdownSeconds) IS the wait before the machine
        # goes off.
        # Upper bound (ms) of a QUEUED inbox message: a message that nobody
        # claims within this window is stuck, so it stops blocking the
        # restart (and the session that holds it is named in the log).
        # Without it a single unclaimed message kept the restart pending for
        # ever. `0` switches the protection off (the old behaviour).
        queuedGraceMs: 60000
        # dsh web: reload the page when the host boot token changes
        autoReloadPage: true
        # hard-block shell commands that would kill/relaunch DSH by hand
        blockManualRestart: true
        healthPath: /__dsh_autorestart/health
        continuationText: ''
        # Take a snapshot of the profile before every restart, so a restart that
        # leaves the host unable to boot can be rolled back automatically.
        backupOnRestart: true
        # Include the installed plugin tree in that snapshot (bigger: ~120 MB here,
        # but it is what lets a rollback undo "a plugin upgrade broke the boot").
        # The first install asks once whether this should be on; the answer is
        # written to THIS key through the official configEditor service, so the
        # settings page and the one-time prompt always show the same value.
        backupIncludePlugins: true
        # Keep at most this many snapshots; older ones are deleted automatically.
        maxBackups: 2
        # THE PLUGIN WATCH: after the host has settled, take one reading of what
        # the loaded plugins actually provide (tools, interface modules,
        # registered packages) and compare it with the previous reading. It
        # reports only what is NO LONGER there; a newly installed plugin is not
        # news and is never reported.
        watchEnabled: true
        # How long (ms) the watch waits after boot before it reads, so plugins
        # that load late are not mistaken for plugins that disappeared.
        watchDelayMs: 8000
        # The WATCHDOG: the process that waits for the relaunched host and
        # puts the snapshot back when it never answers. It has to be triggered
        # LATER, and the machine decides how (a one-off Windows scheduled task,
        # a systemd user timer, or a detached process of our own). Set this to
        # false to switch the automatic rollback off entirely; the settings
        # page then says that there is no automatic rollback.
        # ON by default: during a restart it watches the new version and rolls the
        # backup back when that version never comes up. The user is asked once
        # whether to keep it, and may answer no.
        watchdogEnabled: true
        # How long the detached watcher waits for the relaunched host (ms) before
        # it restores the snapshot. The watcher NEVER launches a second copy of
        # the host: it restores the files and writes the report.
        rollbackTimeoutMs: 90000
        # How long the restart command may run (ms) before the plugin stops
        # waiting for it. A command that starts the host in the foreground never
        # returns — that is not a failure, but it is reported as "still running"
        # instead of "restarted".
        restartCommandTimeoutMs: 30000
        # How long ONE restore step may take (ms): the configuration files, then
        # the installed plugin tree. A restore that does not finish in time is
        # given up and the reason is written into the rollback report.
        rollbackCopyTimeoutMs: 120000
        # The self-starting supervisor: who starts this host.
        # auto = nobody decided yet, installed = the supervisor of this plugin,
        # external = your own way (docker, systemd, your own script),
        # off = no automatic start at all.
        supervisorMode: auto
        # Which form of the self-start record was installed. Empty = the
        # default of this platform (a scheduled task on Windows, a systemd user
        # unit on Linux).
        supervisorKind: ''
        # How long the supervisor waits before it starts the host again after it
        # died. The delay DOUBLES with every failed start.
        supervisorRestartDelayMs: 3000
        # The upper bound of that delay: the supervisor never waits longer.
        supervisorRestartDelayMaxMs: 30000
        # How long the supervisor waits for the host to answer its health route
        # before it restores the snapshot.
        supervisorStartTimeoutMs: 90000
        # How long the supervisor waits between asking the host to stop and
        # killing it.
        supervisorKillGraceMs: 15000
        # The port the supervisor waits for to become free before it starts the
        # host (0 = the port of the current instance).
        supervisorPort: 0
        # Whether the one-time question may install the supervisor without
        # asking again.
        supervisorAutoInstall: false
        # 收工关机：Show the graceful-shutdown button at the foot of the left
        # sidebar, next to the Settings row (root scope: it is there even when
        # no conversation is open).
        # The button arms the countdown; the machine is switched off for real
        # (a WSL host shuts Windows down, not the WSL distribution).
        showSleepButton: true
        # How many seconds the countdown lasts after every conversation is done.
        # A DROPDOWN in the settings page: 0 / 10 / 20 / 30 / 60 seconds.
        # `0` means no countdown at all — the machine is switched off as soon
        # as every conversation is idle (the busy conversations still block
        # it). The plugin counts down itself, so the operating system is asked
        # to shut down immediately afterwards.
        sleepCountdownSeconds: 20
        # A custom shutdown command. Empty = the host is detected automatically
        # (Windows / WSL / Linux / macOS); a value replaces the detected command.
        sleepCommand: ''
